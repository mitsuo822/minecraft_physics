[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcphys-lab"
version = "0.1.0"
description = "Minecraftで物理実験を自動実行・計測・解析するツール"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["lab", "lab.models", "lab.sim", "orchestra"]

[tool.setuptools.package-data]
"lab.models" = ["*.yaml"]
"orchestra" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
