# 1本の動画の工程表。orchestra はこの順に工程を進める。
#
# kind:
#   gate    人の承認（関門）。episode.yaml の approvals.<approval> が埋まるまで止まる
#   agent   Claude のエージェント（.claude/agents/<agent>.md）を呼ぶ
#   command プログラムを実行する（"python" は orchestra を動かしている Python に置き換わる）
#   manual  人の作業。終わったら `python -m orchestra done <EP> <工程>` で進める
#
# 文字列の中の {ep} {exp} {episode} {mc_version} は episode.yaml の値で置き換わる。
# outputs   工程のあとに存在しなければならないファイル（無ければ失敗）
# verdict   審査結果のファイル。「判定: 不合格」なら on_fail の工程まで戻す

steps:
  - id: theme
    kind: gate
    approval: theme
    title: テーマを選ぶ（関門1）
    instructions: >-
      themes/backlog.yaml から選び、episode.yaml の theme・series・experiment を確かめてから
      `python -m orchestra approve {episode} theme --by <名前>`

  - id: research
    kind: agent
    agent: researcher
    title: 調査（数値と出典）
    outputs: ["{ep}/research.md"]

  - id: design
    kind: agent
    agent: physics-modeler
    title: 実験設計と理論モデル
    outputs: ["{exp}/experiment.yaml", "{exp}/model.md"]

  - id: design_review
    kind: agent
    agent: physics-reviewer
    title: 設計の審査
    outputs: ["{ep}/review_design.md"]
    verdict: "{ep}/review_design.md"
    on_fail: design

  - id: design_approval
    kind: gate
    approval: design
    title: 実験設計の承認（関門2）
    instructions: >-
      {exp}/experiment.yaml・{exp}/model.md・{ep}/review_design.md を読み、物理として正しければ
      `python -m orchestra approve {episode} design --by <名前>`

  - id: measure
    kind: command
    title: MCサーバで実験・計測
    command: ["python", "-m", "lab", "run", "{exp}/experiment.yaml", "--mc-version", "{mc_version}"]
    needs_env: [MC_RCON_PASSWORD]
    outputs_glob: "{exp}/results/run_*/summary.md"
    instructions: >-
      mc/server/README.md の手順でサーバを起動し、環境変数 MC_RCON_PASSWORD を設定してから
      もう一度 next を実行する。計測が要らない回（解説だけの回）は
      `python -m orchestra skip {episode} measure --reason ...`

  - id: script
    kind: agent
    agent: scriptwriter
    title: 台本と制作台帳
    outputs: ["{ep}/script.md", "{ep}/ledger.json"]

  - id: check
    kind: command
    title: 台本の数値チェック
    command: ["python", "-m", "orchestra", "check", "{episode}"]

  - id: final_review
    kind: agent
    agent: physics-reviewer
    title: 最終審査（台本・グラフ・タイトル）
    outputs: ["{ep}/review_final.md"]
    verdict: "{ep}/review_final.md"
    on_fail: script

  - id: capture
    kind: manual
    title: 撮影（P2 まで手動）
    instructions: >-
      {exp}/experiment.yaml の shots を撮影し、ledger.json の media_root に置いたら
      `python -m orchestra done {episode} capture`

  - id: build
    kind: command
    title: 長尺・ショートの組立（movie リポジトリ）
    command: null   # movie の M1〜M4 ができたらここにコマンドを書く
    instructions: >-
      movie 側が未実装。組立を手で済ませたら `python -m orchestra done {episode} build`

  - id: publish_prep
    kind: agent
    agent: publisher
    title: タイトル・概要欄・タグ
    outputs: ["{ep}/publish.md"]

  - id: qc
    kind: agent
    agent: qc
    title: 公開前の機械チェック
    outputs: ["{ep}/qc.md"]
    verdict: "{ep}/qc.md"   # on_fail なし: 不合格なら止まり、人が reset で戻す先を決める

  - id: publish
    kind: gate
    approval: publish
    title: 公開（関門3）
    instructions: >-
      完成動画・ショート・{ep}/publish.md を確認し、勤務先の副業・情報開示ルールにも触れないことを確かめてから
      YouTube で公開し、`python -m orchestra approve {episode} publish --by <名前>`
