# 取得依頼（カメラワーク調査の続き）— 正本
#
# 2026-11-19 の調査で、クラウドのセッションからは読めなかったものの一覧。
# 人が手元のPCで保存し、あとでAIが読んで knowledge/filming/ を更新する。
#
# 人が開くのは 取得依頼.html（このファイルから build.py で作る生成物。直接は編集しない）。
#   作り直し: python knowledge/filming/requests/build.py
#
# 保存先はすべて meta.save_root からの相対パス。media/ は .gitignore 済みなので、
# 保存したものはリポジトリに入らない（動画・字幕は他人の著作物なので、入れない）。
#
# 項目の意味
#   tier      A = 最優先 / B = できれば / C = 余裕があれば
#   want      動画で欲しいもの。subs=字幕 / info=概要欄とチャプター / video=映像
#             動画は tier で決まる: A=[subs, info, video]、B と C=[subs, info]
#   look_for  その資料から知りたいこと（AIが読むときの着眼点）
#   resolves  解決したい未確認事項。CW-nn は カメラワーク.md の項目、tools-7 は 撮影ツール.md の §7
#   status    requested=依頼中 / saved=保存済み / used=知見に反映済み（AIが更新する）

meta:
  created_at: "2026-11-19"
  save_root: media/research/camera
  tiers:
    A: {label: 最優先, want: [subs, info, video]}
    B: {label: できれば, want: [subs, info]}
    C: {label: 余裕があれば, want: [subs, info]}
  layout:
    youtube: "youtube/<動画ID>/<動画ID>.info.json、<動画ID>.<言語>.vtt、<動画ID>.mp4"
    web: "web/<名前>.pdf（または .html、.md）"
    src: "src/<リポジトリ名>/（git clone したもの）"
    flashback_ui: "flashback_ui/<番号>_<名前>.png"
    notes: "notes/<名前>.md"

