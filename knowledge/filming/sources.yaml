# 出典の一覧（カメラワークの調査、2026-11-19）
#
# 他のファイルは、ここの id で出典を指す。
#   kind        official_doc=公式ドキュメント / mod_page=作者が書いた配布ページ / changelog=作者が書いた変更履歴 /
#               wiki=Minecraft Wiki / web_search=Web検索の要約 / youtube=YouTubeの動画
#   confidence  その出典から得た事実に付ける確度の上限（一次 / 二次）。意味は CLAUDE.md
#   read        どこまで読んだか
#     youtube の場合  page  = 動画ページの題名・投稿者・公開日・概要欄・チャプターを読んだ
#                     title = 題名と投稿者だけ確認した（概要欄は未読）
#     どの動画も、字幕（発話内容）と映像は確認できていない。
#   tool        動画が扱う道具。flashback / replaymod / cmdcam / cinemalya / vanilla（Java版のコマンド・データパック）/
#               bedrock_camera（統合版の /camera）/ bedrock_addon / other_mod / unknown / live_action（実写）
#   topic       動画の主題（題名・概要欄・チャプターから付けた注記）
#   views       2026-11-19 時点の再生数

meta:
  surveyed_at: "2026-11-19"
  youtube_total: 67
